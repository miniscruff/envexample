name: release

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths: [ CHANGELOG.md ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        # build release binaries with the latest Go release
        go-version: stable

    - name: Get the latest version
      id: latest
      uses: miniscruff/changie-action@v3
      with:
        version: latest
        args: latest

    - name: Add env vars
      run: |
        echo GORELEASER_CURRENT_TAG=${{ steps.latest.outputs.output }} >> $GITHUB_ENV

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6.4.0
      with:
        version: v2.20.0
        args: --release-notes=".changes/${{ steps.latest.outputs.output }}.md" --skip=validate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

