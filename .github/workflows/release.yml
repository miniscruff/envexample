name: release

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths: [ CHANGELOG.md ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Get the latest version
      id: latest
      uses: miniscruff/changie-action@v3
      with:
        version: latest
        args: latest

    # go get -tool and go install only need the tag, Go builds envexample
    - name: Create the release
      run: gh release create "$TAG" --title "$TAG" --notes-file ".changes/$TAG.md" --target "$GITHUB_SHA"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.latest.outputs.output }}
